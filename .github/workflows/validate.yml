name: Validate data files

on:
  pull_request:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.detect.outputs.data_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          changed=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^(data\.json|enriched_data\.json|schema/)' | wc -l)
          echo "data_changed=$([ "$changed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  validate:
    needs: check-changes
    if: needs.check-changes.outputs.data_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install jsonschema requests

      - name: Validate JSON syntax
        run: |
          python -c "import json; json.load(open('data.json'))"         && echo "data.json: valid JSON"
          python -c "import json; json.load(open('enriched_data.json'))" && echo "enriched_data.json: valid JSON"

      - name: Validate data.json against schema
        run: |
          python - <<'EOF'
          import json, jsonschema, sys

          with open('data.json') as f:
              data = json.load(f)
          with open('schema/data.schema.json') as f:
              schema = json.load(f)

          validator = jsonschema.Draft7Validator(schema)
          errors = list(validator.iter_errors(data))
          if errors:
              for e in errors:
                  print(f"ERROR at {list(e.absolute_path)}: {e.message}", file=sys.stderr)
              sys.exit(1)
          print(f"data.json: schema valid ({len(data)} administrations)")
          EOF

      - name: Validate enriched_data.json against schema
        run: |
          python - <<'EOF'
          import json, jsonschema, sys

          with open('enriched_data.json') as f:
              data = json.load(f)
          with open('schema/enriched.schema.json') as f:
              schema = json.load(f)

          validator = jsonschema.Draft7Validator(schema)
          errors = list(validator.iter_errors(data))
          if errors:
              for e in errors:
                  print(f"ERROR at {list(e.absolute_path)}: {e.message}", file=sys.stderr)
              sys.exit(1)

          entries = [k for k in data if not k.startswith('_')]
          print(f"enriched_data.json: schema valid ({len(entries)} evidence entries)")
          EOF

      - name: Check that Recommendation text has not been altered
        run: |
          python - <<'EOF'
          import json, sys

          with open('data.json') as f:
              data = json.load(f)

          for admin in data:
              for inq in admin.get('Inquiries', []):
                  for rec in inq.get('Recommendations', []):
                      text = rec.get('Recommendation', '')
                      if not text.strip():
                          print(f"ERROR: Empty Recommendation in {inq['InquiryName']}", file=sys.stderr)
                          sys.exit(1)
          print("Recommendation text check passed — no empty recommendations found")
          EOF

      - name: Check all evidence items are approved before merging
        run: |
          python - <<'EOF'
          import json, sys

          with open('enriched_data.json') as f:
              data = json.load(f)

          unapproved = []
          for key, entry in data.items():
              if key.startswith('_') or not isinstance(entry, dict):
                  continue
              for i, ev in enumerate(entry.get('evidence', [])):
                  if not ev.get('approved', False):
                      title = ev.get('title', '(no title)')[:60]
                      unapproved.append(f"  {key}  item {i}: {title}")

          if unapproved:
              print(f"ERROR: {len(unapproved)} unapproved evidence item(s) found:", file=sys.stderr)
              for item in unapproved[:20]:
                  print(item, file=sys.stderr)
              if len(unapproved) > 20:
                  print(f"  ... and {len(unapproved) - 20} more", file=sys.stderr)
              print("", file=sys.stderr)
              print("All evidence must have approved:true before merging to main.", file=sys.stderr)
              print("Run  python tools/review_app/app.py  to review and approve entries.", file=sys.stderr)
              sys.exit(1)

          approved = sum(
              1 for k, v in data.items()
              if not k.startswith('_') and isinstance(v, dict)
              for ev in v.get('evidence', []) if ev.get('approved')
          )
          print(f"Approved check passed — {approved} approved evidence item(s)")
          EOF

      - name: Spot-check evidence URLs (HEAD requests)
        run: |
          python - <<'EOF'
          import json, sys, time
          import urllib.request
          import urllib.error

          with open('enriched_data.json') as f:
              data = json.load(f)

          failed = []
          checked = 0
          for key, outcome in data.items():
              if key.startswith('_'):
                  continue
              for ev in outcome.get('evidence', []):
                  url = ev.get('url', '')
                  if not url:
                      continue
                  try:
                      req = urllib.request.Request(url, method='HEAD', headers={
                          'User-Agent': 'Mozilla/5.0 (uk-inquiry-dashboard CI url-check)'
                      })
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          status = resp.status
                          if status >= 400:
                              failed.append((key, url, status))
                          else:
                              checked += 1
                              print(f"  OK {status}: {url}")
                  except urllib.error.HTTPError as e:
                      if e.code in (405, 406):
                          # Some servers reject HEAD but accept GET — not a broken URL
                          checked += 1
                          print(f"  OK (HEAD not allowed, {e.code}): {url}")
                      else:
                          failed.append((key, url, e.code))
                  except Exception as e:
                      failed.append((key, url, str(e)))
                  time.sleep(0.5)  # be polite to servers

          if failed:
              print("\nFAILED URL checks:", file=sys.stderr)
              for key, url, status in failed:
                  print(f"  {key}: {url} -> {status}", file=sys.stderr)
              sys.exit(1)

          print(f"\nURL check passed — {checked} URL(s) verified")
          EOF

  ci-status:
    runs-on: ubuntu-latest
    needs: [validate]
    if: always()
    steps:
      - name: Check result
        run: |
          result="${{ needs.validate.result }}"
          if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
            echo "Data validation failed — see the 'validate' job for details"
            exit 1
          fi
          echo "OK (validate: $result)"
